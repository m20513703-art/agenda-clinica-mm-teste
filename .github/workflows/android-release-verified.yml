name: Build and launch Agenda Clínica APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK exists
        run: test -s "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-clinica-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
            adb shell monkey -p com.mmsistemastecnologia.agendaclinica 1
            sleep 35
            adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/activity.txt"
            grep -q 'com.mmsistemastecnologia.agendaclinica' "$GITHUB_WORKSPACE/activity.txt"
            adb shell screencap -p /sdcard/agenda.png
            adb pull /sdcard/agenda.png "$GITHUB_WORKSPACE/agenda-screen.png"
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml "$GITHUB_WORKSPACE/agenda-ui.xml"
            if grep -Eqi 'Unable to load script|Unfortunately.*stopped|has stopped' "$GITHUB_WORKSPACE/agenda-ui.xml"; then exit 1; fi
            grep -Eqi 'AGENDA DO CONSULTÓRIO|Médicos|Pacientes' "$GITHUB_WORKSPACE/agenda-ui.xml"
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-clinica-emulator-evidence
          path: |
            agenda-screen.png
            agenda-ui.xml
            activity.txt
          if-no-files-found: warn
          retention-days: 14
