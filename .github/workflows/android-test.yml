name: Teste Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo configuration
        run: npx expo config --type public
      - name: Create Android project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-clinica-apk-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.mmsistemastecnologia.agendaclinica 1
            sleep 30
            adb shell dumpsys activity activities | grep -q 'com.mmsistemastecnologia.agendaclinica'
            adb shell screencap -p /sdcard/agenda.png
            adb pull /sdcard/agenda.png agenda-screen.png
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml agenda-ui.xml
            grep -E 'Agenda|Médicos|Pacientes' agenda-ui.xml
      - name: Save emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-clinica-tela-emulador
          path: |
            agenda-screen.png
            agenda-ui.xml
          if-no-files-found: warn
          retention-days: 14
